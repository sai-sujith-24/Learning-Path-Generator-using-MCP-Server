name: Python static and import checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app.py utils.py prompt.py generate_mcp.py test_composio.py
      - run: |
          python - <<'PY'
          import utils
          assert callable(utils.initialize_model)
          assert callable(utils.run_agent_sync)
          print('Module imports passed. Live API integration not tested.')
          PY
